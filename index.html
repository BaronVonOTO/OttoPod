<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0D1117;--surface:#161C27;--surface2:#1E2638;--border:#2A3447;--gold:#C9A84C;--gold-dim:#8A6E2F;--text:#F0EDE6;--text-2:#8B93A8;--text-3:#4E5668;--red:#C25252;--green:#4DAF82;--radius:10px;--radius-lg:14px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;-webkit-text-size-adjust:100%}
.shell{max-width:560px;margin:0 auto;padding:28px 18px 60px}
.hero{display:flex;align-items:flex-end;gap:18px;margin-bottom:32px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.hero-art{width:88px;height:88px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-art-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s;border-radius:12px}
.hero-art:hover .hero-art-overlay{opacity:1}
.hero-info{flex:1;min-width:0}
.hero-title{font-family:'DM Serif Display',serif;font-size:22px;line-height:1.2;color:var(--text);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-sub{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 0 2px rgba(77,175,130,.18)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text-2);font-family:'Inter',sans-serif;font-size:13px;padding:6px 11px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:border-color .15s,color .15s}
.btn-ghost:hover{border-color:var(--text-2);color:var(--text)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px}
.tab{background:none;border:none;font-family:'Inter',sans-serif;font-size:13px;color:var(--text-2);padding:0 0 12px;margin-right:24px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:500}
.tab:hover:not(.active){color:var(--text)}
.content{animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;border:none;transition:opacity .15s;min-height:40px}
.btn:active{opacity:.75}
.btn.primary{background:var(--gold);color:#0D1117}
.btn.primary:hover{opacity:.88}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.secondary:hover{border-color:var(--text-3)}
.btn.red{background:none;border:1px solid #3A2222;color:var(--red)}
.btn.red:hover{background:#1E1414}
.btn:disabled{opacity:.35;cursor:default}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:500}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;border-radius:var(--radius);padding:9px 12px;-webkit-appearance:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold-dim)}
.field textarea{resize:vertical;min-height:72px}
.hint{font-size:11px;color:var(--text-3);margin-top:4px}
.ep-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.ep-row:last-child{border-bottom:none}
.ep-art{width:52px;height:52px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ep-art img{width:100%;height:100%;object-fit:cover}
.ep-info{flex:1;min-width:0}
.ep-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.ep-meta{font-size:11px;color:var(--text-2)}
.ep-player{margin-top:7px}
.ep-player audio{width:100%;height:28px;accent-color:var(--gold)}
.empty-state{text-align:center;padding:48px 16px;color:var(--text-3)}
.empty-state p{font-size:14px;margin-bottom:4px}
.empty-state small{font-size:12px}
.upload-zone{border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.upload-zone:hover{border-color:var(--gold-dim);background:rgba(201,168,76,.04)}
.upload-zone.has-file{border-style:solid;border-color:var(--green);background:rgba(77,175,130,.06)}
.upload-zone p{font-size:14px;color:var(--text-2);margin-top:6px}
.upload-zone small{font-size:11px;color:var(--text-3)}
.progress{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:10px}
.progress-bar{height:100%;background:var(--gold);border-radius:2px;transition:width .2s}
.art-row{display:flex;align-items:center;gap:14px}
.art-preview{width:72px;height:72px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;cursor:pointer;transition:border-color .15s}
.art-preview:hover{border-color:var(--gold-dim)}
.art-preview img{width:100%;height:100%;object-fit:cover}
.art-actions{display:flex;flex-direction:column;gap:7px}
.url-display{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;font-family:monospace;font-size:12px;color:var(--text-2);word-break:break-all;line-height:1.6;margin:10px 0}
.url-token{color:var(--gold);font-weight:500}
.input-row{display:flex;gap:6px;align-items:flex-end}
.input-row .field{flex:1;margin-bottom:0}
.settings-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px}
.settings-group-title{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-end{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 28px;width:100%;max-width:300px;text-align:center}
.auth-logo{font-family:'DM Serif Display',serif;font-size:26px;margin-bottom:4px;color:var(--text)}
.auth-sub{font-size:13px;color:var(--text-2);margin-bottom:24px}
.saving-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
input[type=file]{display:none}
@media(max-width:400px){.hero-title{font-size:19px}.shell{padding:20px 14px 50px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ── IndexedDB storage ──────────────────────────────────────────────
var DB_NAME='ottopod',DB_VER=1,db=null;

function openDB(cb){
  if(db){cb(db);return;}
  var req=indexedDB.open(DB_NAME,DB_VER);
  req.onupgradeneeded=function(e){
    var d=e.target.result;
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');
    if(!d.objectStoreNames.contains('episodes'))d.createObjectStore('episodes',{keyPath:'id'});
  };
  req.onsuccess=function(e){db=e.target.result;cb(db);};
  req.onerror=function(){toast('Storage error — episodes may not save');};
}

function dbGet(store,key,cb){
  openDB(function(d){
    var tx=d.transaction(store,'readonly');
    var req=tx.objectStore(store).get(key);
    req.onsuccess=function(){cb(req.result);};
    req.onerror=function(){cb(null);};
  });
}
function dbPut(store,val,key){
  openDB(function(d){
    var tx=d.transaction(store,'readwrite');
    if(key!==undefined)tx.objectStore(store).put(val,key);
    else tx.objectStore(store).put(val);
  });
}
function dbDelete(store,key){
  openDB(function(d){
    var tx=d.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
  });
}
function dbGetAll(store,cb){
  openDB(function(d){
    var tx=d.transaction(store,'readonly');
    var req=tx.objectStore(store).getAll();
    req.onsuccess=function(){cb(req.result||[]);};
    req.onerror=function(){cb([]);};
  });
}

// ── App state ──────────────────────────────────────────────────────
var S={
  authed:false,tab:'episodes',
  episodes:[],
  feedTitle:'My Private Podcast',feedDesc:'A private podcast feed',feedAuthor:'Podcast Author',
  feedArtwork:null,
  baseUrl:'',feedPath:'/feed.xml',feedToken:'',
  uploadFile:null,uploadTitle:'',uploadDesc:'',uploadArtwork:null,
  uploadProgress:0,uploading:false,
  loaded:false
};

function saveMeta(){
  var m={feedTitle:S.feedTitle,feedDesc:S.feedDesc,feedAuthor:S.feedAuthor,feedArtwork:S.feedArtwork,baseUrl:S.baseUrl,feedPath:S.feedPath,feedToken:S.feedToken};
  dbPut('meta',m,'settings');
  try{localStorage.setItem('pod_pass_v2',localStorage.getItem('pod_pass_v2')||'');}catch(e){}
}
function loadAll(cb){
  dbGet('meta','settings',function(m){
    if(m){
      ['feedTitle','feedDesc','feedAuthor','feedArtwork','baseUrl','feedPath','feedToken'].forEach(function(k){if(m[k]!==undefined)S[k]=m[k];});
    }
    if(!S.baseUrl){
      // auto-detect current origin as base URL
      S.baseUrl=window.location.origin+window.location.pathname.replace(/\/[^\/]*$/,'')||window.location.origin;
    }
    dbGetAll('episodes',function(eps){
      eps.sort(function(a,b){return b.date-a.date;});
      S.episodes=eps;
      S.loaded=true;
      cb();
    });
  });
}

function getPass(){try{return localStorage.getItem('pod_pass_v2')||null;}catch(e){return null;}}
function setPass(p){try{localStorage.setItem('pod_pass_v2',p);}catch(e){}}

// ── Helpers ────────────────────────────────────────────────────────
function genToken(){var a=new Uint8Array(18);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return b.toString(36);}).join('').slice(0,24);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+' MB':(b/1024).toFixed(0)+' KB';}
function fmtDur(s){if(!s)return'';var m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0');}
function getUrl(){var base=(S.baseUrl||'').replace(/\/+$/,'');var path=S.feedPath||'/feed.xml';if(path[0]!=='/')path='/'+path;var tok=(S.feedToken||'').trim();return base+path+(tok?'?token='+tok:'');}

function toast(msg){
  var el=document.getElementById('_toast');
  if(!el){el=document.createElement('div');el.id='_toast';el.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#F0EDE6;color:#0D1117;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999;white-space:nowrap;font-family:Inter,sans-serif';document.body.appendChild(el);}
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity='0';},2400);
}
function setState(u,skipRender){Object.keys(u).forEach(function(k){S[k]=u[k];});if(!skipRender)render();}

// ── SVG icons ──────────────────────────────────────────────────────
var I={
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="20 6 9 17 4 12"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;opacity:.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
};

// ── Art picker ─────────────────────────────────────────────────────
function artPicker(prefix,current,label){
  var has=!!current;
  return '<div class="art-row">'+
    '<div class="art-preview" id="'+prefix+'-thumb" onclick="pickArt(\''+prefix+'\')" title="Change artwork">'+
      (has?'<img src="'+current+'" alt="artwork"/>':'<span style="color:var(--text-3)">'+I.camera+'</span>')+
    '</div>'+
    '<div class="art-actions">'+
      '<button type="button" class="btn secondary" onclick="pickArt(\''+prefix+'\')">'+I.camera+' '+(has?'Change':'Add artwork')+'</button>'+
      (has?'<button type="button" class="btn red" style="font-size:12px;min-height:32px;padding:5px 10px" onclick="clearArt(\''+prefix+'\')">'+I.x+' Remove</button>':'')+
      '<p class="hint">'+(label||'Square JPG or PNG')+'</p>'+
    '</div>'+
    '<input type="file" id="'+prefix+'-file" accept="image/*" onchange="artChosen(this,\''+prefix+'\')"/>'+
  '</div>';
}
function pickArt(p){var el=document.getElementById(p+'-file');if(el)el.click();}
function artChosen(el,p){
  var f=el.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    if(p==='feed-art'){S.feedArtwork=ev.target.result;saveMeta();}
    else S.uploadArtwork=ev.target.result;
    var th=document.getElementById(p+'-thumb');
    if(th)th.innerHTML='<img src="'+ev.target.result+'" alt="artwork"/>';
  };
  r.readAsDataURL(f);
}
function clearArt(p){
  if(p==='feed-art'){S.feedArtwork=null;saveMeta();}
  else S.uploadArtwork=null;
  var th=document.getElementById(p+'-thumb');
  if(th)th.innerHTML='<span style="color:var(--text-3)">'+I.camera+'</span>';
}

// ── Render ─────────────────────────────────────────────────────────
function render(){
  var root=document.getElementById('root');
  if(!root)return;

  if(!S.loaded){
    root.innerHTML='<div class="auth-shell"><div style="color:var(--text-3);font-size:13px">Loading…</div></div>';
    return;
  }

  // AUTH
  if(!S.authed){
    root.innerHTML='<div class="auth-shell"><div class="auth-card">'+
      '<div style="display:flex;justify-content:center;margin-bottom:16px">'+I.lock+'</div>'+
      '<div class="auth-logo">Studio</div>'+
      '<div class="auth-sub">Your private podcast manager</div>'+
      '<div class="field"><input type="password" id="pass-in" placeholder="Password" autocomplete="current-password" style="text-align:center"/></div>'+
      '<button type="button" class="btn primary" style="width:100%;justify-content:center;font-size:14px" onclick="doLogin()">Enter</button>'+
    '</div></div>';
    var pi=document.getElementById('pass-in');
    if(pi)pi.addEventListener('keydown',function(e){if(e.keyCode===13)doLogin();});
    return;
  }

  var content='';

  // EPISODES
  if(S.tab==='episodes'){
    var rows='';
    if(!S.episodes.length){
      rows='<div class="empty-state"><div style="margin-bottom:12px;opacity:.4">'+I.mic+'</div><p>No episodes yet</p><small>Go to Upload to add your first recording</small></div>';
    } else {
      S.episodes.forEach(function(ep){
        var artSrc=ep.artwork||S.feedArtwork||null;
        var art=artSrc?'<div class="ep-art"><img src="'+artSrc+'" alt=""/></div>':'<div class="ep-art" style="color:var(--text-3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:22px;height:22px"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>';
        rows+='<div class="ep-row">'+art+
          '<div class="ep-info">'+
            '<div class="ep-title">'+esc(ep.title)+'</div>'+
            '<div class="ep-meta">'+fmtDate(ep.date)+'<span style="margin:0 5px;color:var(--text-3)">·</span>'+fmtSize(ep.size)+(ep.duration?'<span style="margin:0 5px;color:var(--text-3)">·</span>'+fmtDur(ep.duration):'')+' </div>'+
            (ep.dataUrl?'<div class="ep-player"><audio controls src="'+ep.dataUrl+'" preload="none"></audio></div>':'')+
          '</div>'+
          '<button type="button" class="btn red" style="padding:7px 10px;min-height:36px;flex-shrink:0" onclick="deleteEp(\''+ep.id+'\')" aria-label="Delete">'+I.trash+'</button>'+
        '</div>';
      });
    }
    content='<div style="display:flex;justify-content:flex-end;margin-bottom:18px">'+
      '<button type="button" class="btn primary" onclick="setState({tab:\'upload\'})">'+I.plus+' New episode</button>'+
    '</div><div>'+rows+'</div>';
  }

  // UPLOAD
  if(S.tab==='upload'){
    var f=S.uploadFile;
    content=
      '<div class="settings-group"><div class="settings-group-title">Episode artwork</div>'+artPicker('upload-art',S.uploadArtwork,'Overrides podcast artwork for this episode')+'</div>'+
      '<div class="settings-group"><div class="settings-group-title">Episode details</div>'+
        '<div class="field"><label>Title</label><input type="text" id="ep-title" placeholder="Give this episode a name" value="'+esc(S.uploadTitle)+'" autocomplete="off"/></div>'+
        '<div class="field"><label>Description</label><textarea id="ep-desc" placeholder="Optional">'+esc(S.uploadDesc)+'</textarea></div>'+
      '</div>'+
      '<div class="settings-group"><div class="settings-group-title">Audio file</div>'+
        '<div class="upload-zone '+(f?'has-file':'')+'" onclick="document.getElementById(\'audio-file-in\').click()">'+
          '<input type="file" id="audio-file-in" accept="audio/*" onchange="fileChosen(this)"/>'+
          (f
            ?'<div style="color:var(--green);margin-bottom:6px">'+I.dl+'</div><p style="color:var(--green);font-weight:500">'+esc(f.name)+'</p><small style="color:var(--green);opacity:.8">'+fmtSize(f.size)+' — tap to change</small>'
            :'<div style="opacity:.4;margin-bottom:6px">'+I.dl+'</div><p>Tap to choose audio</p><small>MP3, M4A, WAV, OGG, AAC</small>'
          )+
        '</div>'+
        (S.uploading?'<div class="progress" style="margin-top:12px"><div class="progress-bar" id="prog-bar" style="width:'+S.uploadProgress+'%"></div></div><p style="font-size:12px;color:var(--text-2);margin-top:8px;text-align:center">Processing… '+S.uploadProgress+'%</p>':'')+
      '</div>'+
      '<div class="row-end">'+
        '<button type="button" class="btn secondary" onclick="clearUpload()">Cancel</button>'+
        '<button type="button" class="btn primary" onclick="doUpload()" '+((!f||!S.uploadTitle.trim()||S.uploading)?'disabled':'')+'>'+I.plus+' Add to feed</button>'+
      '</div>';
  }

  // FEED
  if(S.tab==='feed'){
    var url=getUrl();
    var parts=url.split('?token=');
    var urlHtml=esc(parts[0])+(parts[1]?'<span style="color:var(--text-3)">?token=</span><span class="url-token">'+esc(parts[1])+'</span>':'');
    content=
      '<div class="settings-group"><div class="settings-group-title">Feed URL</div>'+
        '<div class="field"><label>Domain</label><input type="text" id="f-base" value="'+esc(S.baseUrl)+'" placeholder="https://yourdomain.com" autocomplete="off" autocorrect="off" autocapitalize="none"/></div>'+
        '<div class="field"><label>Path</label><input type="text" id="f-path" value="'+esc(S.feedPath)+'" placeholder="/feed.xml" autocomplete="off" autocorrect="off" autocapitalize="none"/></div>'+
        '<div class="field"><label>Secret token</label>'+
          '<div class="input-row">'+
            '<div class="field"><input type="text" id="f-token" value="'+esc(S.feedToken)+'" placeholder="leave blank for no token" autocomplete="off" autocorrect="off" autocapitalize="none" style="font-family:monospace;font-size:13px"/></div>'+
            '<button type="button" class="btn secondary" onclick="randomToken()" style="flex-shrink:0;padding:9px 12px" title="Generate random">'+I.shuffle+'</button>'+
            '<button type="button" class="btn red" onclick="clearToken()" style="flex-shrink:0;padding:9px 10px;min-height:40px" title="Clear">'+I.x+'</button>'+
          '</div>'+
          '<p class="hint">Appended as ?token= · leave blank for no token</p>'+
        '</div>'+
        '<button type="button" class="btn primary" onclick="saveFeedUrl()">'+I.check+' Save</button>'+
      '</div>'+
      '<div class="settings-group"><div class="settings-group-title">Your feed URL</div>'+
        '<div class="url-display" id="url-display">'+urlHtml+'</div>'+
        '<div class="row">'+
          '<button type="button" class="btn secondary" onclick="copyUrl()">'+I.copy+' Copy URL</button>'+
          '<button type="button" class="btn primary" onclick="downloadRSS()">'+I.dl+' Download feed.xml</button>'+
        '</div>'+
      '</div>'+
      '<div class="settings-group"><div class="settings-group-title">Add to podcast apps</div>'+
        '<div style="line-height:2;font-size:13px;color:var(--text-2)">'+
          '<div><span style="color:var(--text);font-weight:500">Apple Podcasts</span> — Library → Add a Show → paste URL</div>'+
          '<div><span style="color:var(--text);font-weight:500">Overcast</span> — + → Add URL → paste URL</div>'+
          '<div><span style="color:var(--text);font-weight:500">Pocket Casts</span> — Discover → Add via URL</div>'+
        '</div>'+
      '</div>';
  }

  // SETTINGS
  if(S.tab==='settings'){
    content=
      '<div class="settings-group"><div class="settings-group-title">Podcast artwork</div>'+artPicker('feed-art',S.feedArtwork,'Shown in podcast apps as your cover')+'</div>'+
      '<div class="settings-group"><div class="settings-group-title">Podcast info</div>'+
        '<div class="field"><label>Title</label><input type="text" id="s-title" value="'+esc(S.feedTitle)+'"/></div>'+
        '<div class="field"><label>Description</label><textarea id="s-desc">'+esc(S.feedDesc)+'</textarea></div>'+
        '<div class="field" style="margin-bottom:14px"><label>Author</label><input type="text" id="s-author" value="'+esc(S.feedAuthor)+'"/></div>'+
        '<button type="button" class="btn primary" onclick="saveFeedSettings()">'+I.check+' Save changes</button>'+
      '</div>'+
      '<div class="settings-group"><div class="settings-group-title">Change password</div>'+
        '<div class="field" style="margin-bottom:12px"><label>New password</label><input type="password" id="new-pass" placeholder="Enter new password" autocomplete="new-password"/></div>'+
        '<button type="button" class="btn secondary" onclick="changePass()">Update password</button>'+
      '</div>'+
      '<div class="settings-group" style="border-color:#3A2222"><div class="settings-group-title" style="color:var(--red)">Danger zone</div>'+
        '<p style="font-size:13px;color:var(--text-3);margin-bottom:12px">Permanently removes all episodes from storage.</p>'+
        '<button type="button" class="btn red" onclick="clearAll()">'+I.trash+' Delete all episodes</button>'+
      '</div>';
  }

  // HERO ART
  var heroArt=S.feedArtwork
    ?'<div class="hero-art"><img src="'+S.feedArtwork+'" alt="podcast artwork"/><div class="hero-art-overlay" onclick="pickFeedArt()"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div></div>'
    :'<div class="hero-art" onclick="pickFeedArt()" title="Add artwork" style="color:var(--text-3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="width:28px;height:28px"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>';

  root.innerHTML='<div class="shell">'+
    '<div class="hero">'+
      heroArt+
      '<input type="file" id="hero-art-file" accept="image/*" onchange="heroArtChosen(this)" style="display:none"/>'+
      '<div class="hero-info">'+
        '<div class="hero-title">'+esc(S.feedTitle)+'</div>'+
        '<div class="hero-sub"><span class="live-dot"></span><span>Private feed</span><span style="color:var(--text-3)">·</span><span>'+S.episodes.length+' episode'+(S.episodes.length!==1?'s':'')+'</span></div>'+
      '</div>'+
      '<button type="button" class="btn-ghost" onclick="doLogout()" title="Sign out">'+I.logout+'</button>'+
    '</div>'+
    '<div class="tabs">'+
      ['episodes','upload','feed','settings'].map(function(t){
        var labels={episodes:'Episodes',upload:'Upload',feed:'RSS Feed',settings:'Settings'};
        return'<button type="button" class="tab'+(S.tab===t?' active':'')+'" onclick="setState({tab:\''+t+'\'})">'+labels[t]+'</button>';
      }).join('')+
    '</div>'+
    '<div class="content">'+content+'</div>'+
  '</div>';

  bindInputs();
}

function bindInputs(){
  function bind(id,key){var el=document.getElementById(id);if(el)el.addEventListener('input',function(e){S[key]=e.target.value;});}
  bind('ep-title','uploadTitle');bind('ep-desc','uploadDesc');
  bind('s-title','feedTitle');bind('s-desc','feedDesc');bind('s-author','feedAuthor');
  bind('f-base','baseUrl');bind('f-path','feedPath');bind('f-token','feedToken');
}

// ── Actions ────────────────────────────────────────────────────────
function pickFeedArt(){document.getElementById('hero-art-file').click();}
function heroArtChosen(el){
  var f=el.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){S.feedArtwork=ev.target.result;saveMeta();render();};
  r.readAsDataURL(f);
}

function doLogin(){
  var val=document.getElementById('pass-in').value;
  var stored=getPass();
  // first time — no password set yet, any input sets it
  if(!stored){setPass(val);S.authed=true;render();return;}
  if(val===stored){S.authed=true;render();}
  else toast('Incorrect password');
}
function doLogout(){setState({authed:false});}

function fileChosen(el){var f=el.files[0];if(f){S.uploadFile=f;render();}}

function doUpload(){
  if(!S.uploadFile||!S.uploadTitle.trim())return;
  S.uploading=true;S.uploadProgress=0;render();
  var file=S.uploadFile,title=S.uploadTitle,desc=S.uploadDesc,artwork=S.uploadArtwork;
  var prog=0;
  var tick=setInterval(function(){prog=Math.min(prog+8,90);var b=document.getElementById('prog-bar');if(b)b.style.width=prog+'%';},120);
  var reader=new FileReader();
  reader.onload=function(ev){
    clearInterval(tick);
    var audio=new Audio();audio.src=ev.target.result;
    function finish(dur){
      var ep={id:'ep_'+Date.now(),title:title,desc:desc,date:Date.now(),size:file.size,type:file.type||'audio/mpeg',duration:dur,dataUrl:ev.target.result,filename:file.name,artwork:artwork};
      dbPut('episodes',ep);
      S.episodes.unshift(ep);
      S.uploadFile=null;S.uploadTitle='';S.uploadDesc='';S.uploadArtwork=null;S.uploading=false;
      setState({tab:'episodes'});toast('Episode saved');
    }
    audio.onloadedmetadata=function(){finish(audio.duration);};
    audio.onerror=function(){finish(0);};
  };
  reader.onerror=function(){clearInterval(tick);S.uploading=false;render();toast('Error reading file');};
  reader.readAsDataURL(file);
}

function clearUpload(){S.uploadFile=null;S.uploadTitle='';S.uploadDesc='';S.uploadArtwork=null;setState({tab:'episodes'});}

function deleteEp(id){
  if(!confirm('Delete this episode?'))return;
  dbDelete('episodes',id);
  S.episodes=S.episodes.filter(function(e){return e.id!==id;});
  render();toast('Episode deleted');
}
function clearAll(){
  if(!confirm('Delete all episodes? This cannot be undone.'))return;
  S.episodes.forEach(function(ep){dbDelete('episodes',ep.id);});
  S.episodes=[];render();toast('All episodes removed');
}

function generateRSS(){
  var items=S.episodes.map(function(ep){
    return'<item>'+
      '<title><![CDATA['+ep.title+']]></title>'+
      '<description><![CDATA['+(ep.desc||'')+']]></description>'+
      '<pubDate>'+new Date(ep.date).toUTCString()+'</pubDate>'+
      '<guid isPermaLink="false">'+ep.id+'</guid>'+
      '<enclosure url="'+(ep.dataUrl||'')+'" length="'+(ep.size||0)+'" type="'+(ep.type||'audio/mpeg')+'"/>'+
      (ep.artwork||S.feedArtwork?'<itunes:image href="'+(ep.artwork||S.feedArtwork)+'"/>'  :'')+
      '<itunes:duration>'+(ep.duration||0)+'</itunes:duration>'+
    '</item>';
  }).join('\n');
  return'<?xml version="1.0" encoding="UTF-8"?>\n<rss version="2.0" xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd">\n<channel>\n'+
    '<title><![CDATA['+S.feedTitle+']]></title>\n'+
    '<description><![CDATA['+S.feedDesc+']]></description>\n'+
    '<itunes:author>'+S.feedAuthor+'</itunes:author>\n'+
    (S.feedArtwork?'<itunes:image><url>'+S.feedArtwork+'</url></itunes:image>\n':'')+
    '<language>en-us</language>\n'+
    '<lastBuildDate>'+new Date().toUTCString()+'</lastBuildDate>\n'+
    items+'\n</channel>\n</rss>';
}
function downloadRSS(){
  var blob=new Blob([generateRSS()],{type:'application/xml'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='feed.xml';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast('feed.xml downloaded');
}

function saveFeedUrl(){
  var b=document.getElementById('f-base'),p=document.getElementById('f-path'),t=document.getElementById('f-token');
  if(b)S.baseUrl=b.value.trim();if(p)S.feedPath=p.value.trim();if(t)S.feedToken=t.value.trim();
  saveMeta();toast('URL saved');
  var d=document.getElementById('url-display');
  if(d){var url=getUrl();var parts=url.split('?token=');d.innerHTML=esc(parts[0])+(parts[1]?'<span style="color:var(--text-3)">?token=</span><span class="url-token">'+esc(parts[1])+'</span>':'');}
}
function randomToken(){var t=document.getElementById('f-token');var tok=genToken();if(t)t.value=tok;S.feedToken=tok;}
function clearToken(){var t=document.getElementById('f-token');if(t)t.value='';S.feedToken='';}

function copyUrl(){
  var url=getUrl();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){toast('URL copied');}).catch(function(){fbCopy(url);});
  }else{fbCopy(url);}
}
function fbCopy(text){
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');toast('URL copied');}catch(e){toast('Long-press URL to copy');}
  document.body.removeChild(ta);
}
function saveFeedSettings(){
  var t=document.getElementById('s-title'),d=document.getElementById('s-desc'),a=document.getElementById('s-author');
  if(t)S.feedTitle=t.value;if(d)S.feedDesc=d.value;if(a)S.feedAuthor=a.value;
  saveMeta();render();toast('Saved');
}
function changePass(){
  var v=document.getElementById('new-pass').value.trim();
  if(!v){toast('Enter a new password');return;}
  setPass(v);toast('Password updated');
  document.getElementById('new-pass').value='';
}

// ── Boot ───────────────────────────────────────────────────────────
render(); // show loading
loadAll(function(){
  // auto-login if no password set yet
  var p=getPass();
  if(!p){S.authed=false;}
  render();
});
</script>
</body>
</html>
