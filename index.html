<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0D1117;--surface:#161C27;--surface2:#1E2638;--border:#2A3447;--gold:#C9A84C;--gold-dim:#8A6E2F;--text:#F0EDE6;--text-2:#8B93A8;--text-3:#4E5668;--red:#C25252;--green:#4DAF82;--radius:10px;--radius-lg:14px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;-webkit-text-size-adjust:100%}
.shell{max-width:580px;margin:0 auto;padding:28px 18px 60px}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:32px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.hero-art{width:72px;height:72px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-info{flex:1;min-width:0}
.hero-title{font-family:'DM Serif Display',serif;font-size:21px;line-height:1.2;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-sub{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 0 2px rgba(77,175,130,.18)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text-2);font-family:'Inter',sans-serif;font-size:13px;padding:6px 11px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-ghost:hover{border-color:var(--text-2);color:var(--text)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{background:none;border:none;font-family:'Inter',sans-serif;font-size:13px;color:var(--text-2);padding:0 0 12px;margin-right:22px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:500}
.tab:hover:not(.active){color:var(--text)}
.content{animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;border:none;min-height:40px;transition:opacity .15s}
.btn:active{opacity:.7}
.btn.primary{background:var(--gold);color:#0D1117}
.btn.primary:hover{opacity:.88}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.secondary:hover{border-color:var(--text-2)}
.btn.red{background:none;border:1px solid #3A2222;color:var(--red)}
.btn.red:hover{background:#1E1414}
.btn.green{background:var(--green);color:#0D1117}
.btn.green:hover{opacity:.88}
.btn:disabled{opacity:.35;cursor:default}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:500}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;border-radius:var(--radius);padding:9px 12px;-webkit-appearance:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold-dim)}
.field textarea{resize:vertical;min-height:68px}
.hint{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.5}
.hint a{color:var(--text-2);text-decoration:underline}
.sg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px}
.sg-title{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-end{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.ep-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.ep-row:last-child{border-bottom:none}
.ep-art{width:50px;height:50px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ep-art img{width:100%;height:100%;object-fit:cover}
.ep-info{flex:1;min-width:0}
.ep-title-text{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.ep-meta{font-size:11px;color:var(--text-2)}
.empty-state{text-align:center;padding:48px 16px;color:var(--text-3)}
.empty-state p{font-size:14px;margin-bottom:4px}
.empty-state small{font-size:12px}
.url-display{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;font-family:monospace;font-size:12px;color:var(--text-2);word-break:break-all;line-height:1.6;margin:10px 0}
.url-token{color:var(--gold);font-weight:500}
.input-row{display:flex;gap:6px;align-items:flex-end}
.input-row .field{flex:1;margin-bottom:0}
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 28px;width:100%;max-width:300px;text-align:center}
.auth-logo{font-family:'DM Serif Display',serif;font-size:26px;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--text-2);margin-bottom:24px}
/* Progress overlay */
.progress-overlay{position:fixed;inset:0;background:rgba(13,17,23,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;gap:16px}
.progress-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 32px;min-width:280px;text-align:center}
.progress-title{font-size:14px;font-weight:500;margin-bottom:4px}
.progress-sub{font-size:12px;color:var(--text-2);margin-bottom:16px}
.progress-bar-wrap{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.progress-steps{margin-top:14px;text-align:left}
.progress-step{font-size:12px;color:var(--text-3);padding:3px 0;display:flex;align-items:center;gap:8px}
.progress-step.done{color:var(--green)}
.progress-step.active{color:var(--text)}
.step-icon{width:14px;flex-shrink:0;text-align:center}
/* upload zone */
.upload-zone{border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:24px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.upload-zone:hover{border-color:var(--gold-dim);background:rgba(201,168,76,.04)}
.upload-zone.has-file{border-style:solid;border-color:var(--green);background:rgba(77,175,130,.06)}
.upload-zone p{font-size:14px;color:var(--text-2);margin-top:6px}
.upload-zone small{font-size:11px;color:var(--text-3)}
/* setup warning */
.setup-banner{background:#1A1608;border:1px solid #4A3A10;border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;font-size:13px;color:#C9A84C;display:flex;gap:10px;align-items:flex-start}
.setup-banner svg{flex-shrink:0;margin-top:1px}
input[type=file]{display:none}
@media(max-width:400px){.hero-title{font-size:18px}.shell{padding:20px 14px 50px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="prog-overlay" style="display:none" class="progress-overlay">
  <div class="progress-card">
    <div class="progress-title" id="prog-title">Publishing…</div>
    <div class="progress-sub" id="prog-sub">Please wait</div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog-bar" style="width:0%"></div></div>
    <div class="progress-steps" id="prog-steps"></div>
  </div>
</div>
<script>
var SK='ottopod_v6';
var S={
  authed:false,tab:'episodes',
  episodes:[],
  feedTitle:'My Private Podcast',feedDesc:'A private podcast feed',feedAuthor:'Podcast Author',
  artworkUrl:'',
  ghToken:'',ghUser:'',ghRepo:'',ghBranch:'main',
  feedToken:'',
  loaded:false,
  // upload form state
  _f:null,_title:'',_desc:'',_dur:'',_artFile:null,_artUrl:''
};

function saveMeta(){
  var d={episodes:S.episodes,feedTitle:S.feedTitle,feedDesc:S.feedDesc,feedAuthor:S.feedAuthor,artworkUrl:S.artworkUrl,ghToken:S.ghToken,ghUser:S.ghUser,ghRepo:S.ghRepo,ghBranch:S.ghBranch,feedToken:S.feedToken};
  try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}
}
function loadAll(){
  try{
    var d=JSON.parse(localStorage.getItem(SK)||'{}');
    ['episodes','feedTitle','feedDesc','feedAuthor','artworkUrl','ghToken','ghUser','ghRepo','ghBranch','feedToken'].forEach(function(k){if(d[k]!==undefined)S[k]=d[k];});
  }catch(e){}
  // auto-detect from github.io URL
  if((!S.ghUser||!S.ghRepo)&&window.location.hostname.endsWith('github.io')){
    var host=window.location.hostname;
    S.ghUser=host.replace('.github.io','');
    var parts=window.location.pathname.split('/').filter(Boolean);
    if(parts.length)S.ghRepo=parts[0];
  }
  S.loaded=true;
}
function getPass(){try{return localStorage.getItem('pod_pass_v4')||null;}catch(e){return null;}}
function setPass(p){try{localStorage.setItem('pod_pass_v4',p);}catch(e){}}

function isConfigured(){return S.ghToken&&S.ghUser&&S.ghRepo;}
function getRepoUrl(){return'https://'+S.ghUser+'.github.io/'+S.ghRepo;}
function getRssUrl(){var tok=(S.feedToken||'').trim();return getRepoUrl()+'/feed.xml'+(tok?'?token='+tok:'');}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function genToken(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return b.toString(36);}).join('').slice(0,20);}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||('ep-'+Date.now());}

function toast(msg,dur){
  var el=document.getElementById('_t');
  if(!el){el=document.createElement('div');el.id='_t';el.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#F0EDE6;color:#0D1117;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999;white-space:nowrap;font-family:Inter,sans-serif;max-width:90vw;text-align:center';document.body.appendChild(el);}
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity='0';},dur||2600);
}
function setState(u){Object.keys(u).forEach(function(k){S[k]=u[k];});render();}

var I={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="20 6 9 17 4 12"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;opacity:.35"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>',
  music:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:20px;height:20px"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>'
};

// ── GitHub API ─────────────────────────────────────────────────────
function ghHeaders(){
  return{'Authorization':'token '+S.ghToken,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'};
}
function ghApiBase(){return'https://api.github.com/repos/'+S.ghUser+'/'+S.ghRepo;}

// Get existing file SHA (needed to update a file)
function getFileSha(path,cb){
  fetch(ghApiBase()+'/contents/'+path,{headers:ghHeaders()})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){cb(d&&d.sha?d.sha:null);})
    .catch(function(){cb(null);});
}

// Upload any file (base64) to GitHub
function ghUpload(path,base64Content,message,cb){
  getFileSha(path,function(sha){
    var body={message:message,content:base64Content,branch:S.ghBranch||'main'};
    if(sha)body.sha=sha;
    fetch(ghApiBase()+'/contents/'+path,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d};});})
      .then(function(res){cb(res.ok,res.data);})
      .catch(function(e){cb(false,e);});
  });
}

// Read file as ArrayBuffer then base64
function fileToBase64(file,cb){
  var r=new FileReader();
  r.onload=function(e){
    var ab=e.target.result;
    var bytes=new Uint8Array(ab);
    var s='';for(var i=0;i<bytes.byteLength;i++)s+=String.fromCharCode(bytes[i]);
    cb(btoa(s));
  };
  r.readAsArrayBuffer(file);
}

// Resize & convert image to compliant JPEG (min 1400x1400, square cropped)
// Apple Podcasts requires: JPEG or PNG, square, 1400x1400 to 3000x3000
function processImage(file,cb){
  var url=URL.createObjectURL(file);
  var img=new Image();
  img.onload=function(){
    URL.revokeObjectURL(url);
    var SIZE=1400;
    var canvas=document.createElement('canvas');
    canvas.width=SIZE;canvas.height=SIZE;
    var ctx=canvas.getContext('2d');
    // Fill white background (in case of transparent PNG)
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,SIZE,SIZE);
    // Centre-crop to square
    var sw=img.width,sh=img.height;
    var side=Math.min(sw,sh);
    var sx=(sw-side)/2,sy=(sh-side)/2;
    ctx.drawImage(img,sx,sy,side,side,0,0,SIZE,SIZE);
    // Export as JPEG
    var dataUrl=canvas.toDataURL('image/jpeg',0.92);
    var b64=dataUrl.split(',')[1];
    cb(b64);
  };
  img.onerror=function(){
    // Fallback: just send as-is
    fileToBase64(file,cb);
  };
  img.src=url;
}

// ── Progress UI ────────────────────────────────────────────────────
var _steps=[];
function showProgress(title,steps){
  _steps=steps.map(function(s){return{label:s,state:'pending'};});
  document.getElementById('prog-title').textContent=title;
  document.getElementById('prog-sub').textContent='Starting…';
  document.getElementById('prog-bar').style.width='0%';
  renderSteps();
  document.getElementById('prog-overlay').style.display='flex';
}
function updateStep(idx,state,sub){
  if(_steps[idx])_steps[idx].state=state;
  var pct=Math.round((_steps.filter(function(s){return s.state==='done';}).length/_steps.length)*100);
  document.getElementById('prog-bar').style.width=pct+'%';
  if(sub)document.getElementById('prog-sub').textContent=sub;
  renderSteps();
}
function renderSteps(){
  document.getElementById('prog-steps').innerHTML=_steps.map(function(s){
    var icon=s.state==='done'?'✓':s.state==='active'?'→':s.state==='error'?'✗':'·';
    return'<div class="progress-step '+s.state+'"><span class="step-icon">'+icon+'</span>'+s.label+'</div>';
  }).join('');
}
function hideProgress(){document.getElementById('prog-overlay').style.display='none';}

// ── Publish episode ────────────────────────────────────────────────
function publishEpisode(){
  if(!isConfigured()){toast('Go to Settings and connect your GitHub repo first');setState({tab:'settings'});return;}
  var title=(S._title||'').trim();
  if(!title){toast('Please enter a title');return;}
  if(!S._f){toast('Please choose an audio file');return;}

  var audioFile=S._f;
  var artFile=S._artFile;
  var slug=slugify(title)+'-'+Date.now();
  var audioFilename='audio/'+slug+'.'+audioFile.name.split('.').pop();
  var artFilename=artFile?'artwork/'+slug+'.jpg':null;
  var audioUrl=getRepoUrl()+'/'+audioFilename;
  var artUrl=artFilename?getRepoUrl()+'/'+artFilename:null;

  var stepLabels=['Upload audio'];
  if(artFile)stepLabels.push('Upload artwork');
  stepLabels.push('Update RSS feed');

  showProgress('Publishing episode…',stepLabels);
  var stepIdx=0;

  function doAudio(){
    updateStep(stepIdx,'active','Uploading '+audioFile.name+'…');
    fileToBase64(audioFile,function(b64){
      ghUpload(audioFilename,b64,'Add audio: '+title,function(ok,data){
        if(!ok){updateStep(stepIdx,'error','Upload failed');hideProgress();toast('Audio upload failed — check your token and repo name',4000);return;}
        updateStep(stepIdx,'done');stepIdx++;
        if(artFile)doArt();else doFeed(audioUrl,null,audioFile.size);
      });
    });
  }

  function doArt(){
    updateStep(stepIdx,'active','Processing & uploading artwork…');
    // Force .jpg extension since we always output JPEG
    artFilename=artFilename.replace(/\.[^.]+$/,'.jpg');
    artUrl=getRepoUrl()+'/'+artFilename;
    processImage(artFile,function(b64){
      ghUpload(artFilename,b64,'Add artwork: '+title,function(ok){
        if(ok){updateStep(stepIdx,'done');}else{updateStep(stepIdx,'error');}
        stepIdx++;
        doFeed(audioUrl,ok?artUrl:null,audioFile.size);
      });
    });
  }

  function doFeed(aUrl,artU,size){
    updateStep(stepIdx,'active','Updating feed.xml…');
    var ep={id:'ep_'+Date.now(),title:title,desc:S._desc||'',duration:S._dur||'',date:Date.now(),audioUrl:aUrl,artworkUrl:artU||'',size:size};
    var newEps=[ep].concat(S.episodes);
    var rssStr=buildRSS(newEps);
    var b64=btoa(unescape(encodeURIComponent(rssStr)));
    ghUpload('feed.xml',b64,'Update feed: '+title,function(ok){
      if(!ok){updateStep(stepIdx,'error');hideProgress();toast('Feed update failed',4000);return;}
      updateStep(stepIdx,'done','Done!');
      S.episodes=newEps;S._f=null;S._title='';S._desc='';S._dur='';S._artFile=null;S._artUrl='';
      saveMeta();
      setTimeout(function(){hideProgress();setState({tab:'episodes'});toast('Episode published!');},900);
    });
  }

  doAudio();
}

// ── Also publish artwork-only update (for podcast cover) ──────────
function publishCoverArt(file,cb){
  // Always save as .jpg — processImage outputs JPEG
  var filename='artwork/cover.jpg';
  updateStep(0,'active','Processing & uploading cover art…');
  processImage(file,function(b64){
    ghUpload(filename,b64,'Update podcast cover art',function(ok){
      if(ok){S.artworkUrl=getRepoUrl()+'/'+filename;saveMeta();}
      cb(ok);
    });
  });
}

// ── RSS builder ────────────────────────────────────────────────────
function buildRSS(eps){
  var base=getRepoUrl();
  var coverUrl=S.artworkUrl||'';
  var items=(eps||S.episodes).map(function(ep){
    // Per-episode artwork: use episode art if set, else fall back to podcast cover
    var artU=ep.artworkUrl||coverUrl;
    // Detect audio type from URL
    var audioType='audio/mpeg';
    if(ep.audioUrl){
      var ext=ep.audioUrl.split('.').pop().toLowerCase().split('?')[0];
      if(ext==='m4a')audioType='audio/x-m4a';
      else if(ext==='ogg')audioType='audio/ogg';
      else if(ext==='wav')audioType='audio/wav';
      else if(ext==='aac')audioType='audio/aac';
    }
    return'  <item>\n'+
      '    <title><![CDATA['+ep.title+']]></title>\n'+
      '    <description><![CDATA['+(ep.desc||ep.title)+']]></description>\n'+
      '    <pubDate>'+new Date(ep.date).toUTCString()+'</pubDate>\n'+
      '    <guid isPermaLink="false">'+ep.id+'</guid>\n'+
      '    <link>'+ep.audioUrl+'</link>\n'+
      '    <enclosure url="'+ep.audioUrl+'" length="'+(ep.size||0)+'" type="'+audioType+'"/>\n'+
      // itunes:image MUST use href attribute, not child element, at episode level
      (artU?'    <itunes:image href="'+artU+'"/>\n':'')+
      (ep.duration?'    <itunes:duration>'+ep.duration+'</itunes:duration>\n':'')+
      '  </item>';
  }).join('\n');
  return'<?xml version="1.0" encoding="UTF-8"?>\n'+
    '<rss version="2.0"\n'+
    '  xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd"\n'+
    '  xmlns:atom="http://www.w3.org/2005/Atom"\n'+
    '  xmlns:content="http://purl.org/rss/1.0/modules/content/">\n'+
    '<channel>\n'+
    '  <title><![CDATA['+S.feedTitle+']]></title>\n'+
    '  <link>'+base+'</link>\n'+
    '  <description><![CDATA['+S.feedDesc+']]></description>\n'+
    '  <language>en-us</language>\n'+
    '  <itunes:author>'+esc(S.feedAuthor)+'</itunes:author>\n'+
    '  <itunes:explicit>false</itunes:explicit>\n'+
    // Channel-level image: itunes:image uses href attribute (NOT child <url> tag)
    (coverUrl?'  <itunes:image href="'+coverUrl+'"/>\n':'')+
    // Also include standard <image> block for max compatibility
    (coverUrl?'  <image>\n    <url>'+coverUrl+'</url>\n    <title>'+S.feedTitle+'</title>\n    <link>'+base+'</link>\n  </image>\n':'')+
    '  <lastBuildDate>'+new Date().toUTCString()+'</lastBuildDate>\n'+
    '  <atom:link href="'+base+'/feed.xml" rel="self" type="application/rss+xml"/>\n'+
    items+'\n'+
    '</channel>\n</rss>';
}

// ── Render ─────────────────────────────────────────────────────────
function render(){
  var root=document.getElementById('root');if(!root)return;
  if(!S.loaded){root.innerHTML='<div class="auth-shell"><div style="color:var(--text-3);font-size:13px">Loading…</div></div>';return;}

  if(!S.authed){
    root.innerHTML='<div class="auth-shell"><div class="auth-card">'+
      '<div style="display:flex;justify-content:center;margin-bottom:16px">'+I.lock+'</div>'+
      '<div class="auth-logo">Studio</div>'+
      '<div class="auth-sub">Your private podcast manager</div>'+
      '<div class="field"><input type="password" id="pass-in" placeholder="Password" autocomplete="current-password" style="text-align:center"/></div>'+
      '<button type="button" class="btn primary" style="width:100%;justify-content:center" onclick="doLogin()">Enter</button>'+
    '</div></div>';
    var pi=document.getElementById('pass-in');if(pi)pi.addEventListener('keydown',function(e){if(e.keyCode===13)doLogin();});
    return;
  }

  var notConfigured=!isConfigured();
  var banner=notConfigured?'<div class="setup-banner">'+I.warn+'<span>Go to <strong>Settings</strong> to connect your GitHub repo before publishing.</span></div>':'';

  var content='';

  // EPISODES
  if(S.tab==='episodes'){
    var rows='';
    if(!S.episodes.length){
      rows='<div class="empty-state"><div style="margin-bottom:12px;opacity:.4">'+I.mic+'</div><p>No episodes yet</p><small>Go to Upload to publish your first episode</small></div>';
    } else {
      S.episodes.forEach(function(ep){
        var artSrc=ep.artworkUrl||S.artworkUrl||null;
        var art=artSrc?'<div class="ep-art"><img src="'+esc(artSrc)+'" alt=""/></div>':'<div class="ep-art" style="color:var(--text-3)">'+I.music+'</div>';
        rows+='<div class="ep-row">'+art+
          '<div class="ep-info">'+
            '<div class="ep-title-text">'+esc(ep.title)+'</div>'+
            '<div class="ep-meta">'+fmtDate(ep.date)+(ep.duration?' · '+ep.duration:'')+'</div>'+
          '</div>'+
          '<button type="button" class="btn red" style="padding:7px 10px;min-height:36px;flex-shrink:0" onclick="deleteEp(\''+ep.id+'\')" aria-label="Delete">'+I.trash+'</button>'+
        '</div>';
      });
    }
    content=banner+
      '<div style="display:flex;justify-content:flex-end;margin-bottom:18px">'+
        '<button type="button" class="btn primary" onclick="setState({tab:\'upload\'})">'+I.plus+' New episode</button>'+
      '</div><div>'+rows+'</div>';
  }

  // UPLOAD
  if(S.tab==='upload'){
    var f=S._f;
    var af=S._artFile;
    content=banner+
      '<div class="sg"><div class="sg-title">Episode details</div>'+
        '<div class="field"><label>Title</label><input type="text" id="ep-title" placeholder="Episode title" value="'+esc(S._title)+'" autocomplete="off"/></div>'+
        '<div class="field"><label>Description</label><textarea id="ep-desc" placeholder="Optional">'+esc(S._desc)+'</textarea></div>'+
        '<div class="field"><label>Duration <span style="font-weight:400;color:var(--text-3)">(optional)</span></label><input type="text" id="ep-dur" placeholder="e.g. 32:10" value="'+esc(S._dur)+'" autocomplete="off"/></div>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Audio file</div>'+
        '<div class="upload-zone '+(f?'has-file':'')+'" onclick="document.getElementById(\'_audio-in\').click()">'+
          '<input type="file" id="_audio-in" accept="audio/*" onchange="audioChosen(this)"/>'+
          (f?'<div style="color:var(--green);margin-bottom:6px">'+I.music+'</div><p style="color:var(--green);font-weight:500">'+esc(f.name)+'</p><small style="color:var(--green)">'+(f.size>1048576?(f.size/1048576).toFixed(1)+' MB':(f.size/1024).toFixed(0)+' KB')+' · tap to change</small>':'<div style="opacity:.4;margin-bottom:6px">'+I.upload+'</div><p>Tap to choose audio</p><small>MP3, M4A, WAV, OGG, AAC</small>')+
        '</div>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Episode artwork <span style="font-weight:400;color:var(--text-3)">(optional)</span></div>'+
        '<div class="upload-zone '+(af?'has-file':'')+'" onclick="document.getElementById(\'_art-in\').click()">'+
          '<input type="file" id="_art-in" accept="image/*" onchange="artChosen(this)"/>'+
          (af?'<div style="color:var(--green);margin-bottom:6px">'+I.camera+'</div><p style="color:var(--green);font-weight:500">'+esc(af.name)+'</p><small style="color:var(--green)">tap to change</small>':'<div style="opacity:.4;margin-bottom:6px">'+I.camera+'</div><p>Tap to choose artwork</p><small>JPG or PNG · square recommended</small>')+
        '</div>'+
      '</div>'+
      '<div class="row-end">'+
        '<button type="button" class="btn secondary" onclick="cancelUpload()">Cancel</button>'+
        '<button type="button" class="btn primary" onclick="publishEpisode()" '+(notConfigured||!f||!S._title.trim()?'disabled':'')+'>'+I.dl+' Publish to GitHub</button>'+
      '</div>';
  }

  // RSS FEED
  if(S.tab==='feed'){
    var rssUrl=getRssUrl();
    var urlParts=rssUrl.split('?token=');
    var urlHtml=esc(urlParts[0])+(urlParts[1]?'<span style="color:var(--text-3)">?token=</span><span class="url-token">'+esc(urlParts[1])+'</span>':'');
    content=
      '<div class="sg"><div class="sg-title">Your RSS feed URL</div>'+
        '<div class="url-display">'+urlHtml+'</div>'+
        '<div class="row">'+
          '<button type="button" class="btn secondary" onclick="copyUrl()">'+I.copy+' Copy URL</button>'+
        '</div>'+
        '<p class="hint" style="margin-top:10px">Share this URL with friends so they can subscribe in any podcast app. Each time you publish an episode the feed updates automatically.</p>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Secret token <span style="font-weight:400;color:var(--text-3)">(optional)</span></div>'+
        '<div class="field">'+
          '<div class="input-row">'+
            '<div class="field"><input type="text" id="f-token" value="'+esc(S.feedToken)+'" placeholder="leave blank for public" autocomplete="off" autocorrect="off" autocapitalize="none" style="font-family:monospace;font-size:13px"/></div>'+
            '<button type="button" class="btn secondary" onclick="randomToken()" style="flex-shrink:0;padding:9px 12px">'+I.shuffle+'</button>'+
            '<button type="button" class="btn red" onclick="clearToken()" style="flex-shrink:0;padding:9px 10px;min-height:40px">'+I.x+'</button>'+
          '</div>'+
          '<p class="hint">Appended as ?token= to your feed URL. Anyone with the full URL can subscribe — it just hides the feed from random discovery.</p>'+
        '</div>'+
        '<button type="button" class="btn primary" onclick="saveToken()">'+I.check+' Save & republish feed</button>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Add to podcast apps</div>'+
        '<div style="line-height:2.1;font-size:13px;color:var(--text-2)">'+
          '<div><span style="color:var(--text);font-weight:500">Apple Podcasts</span> — Library → Add a Show → paste URL</div>'+
          '<div><span style="color:var(--text);font-weight:500">Overcast</span> — + → Add URL → paste URL</div>'+
          '<div><span style="color:var(--text);font-weight:500">Pocket Casts</span> — Discover → Add via URL</div>'+
        '</div>'+
      '</div>';
  }

  // SETTINGS
  if(S.tab==='settings'){
    content=
      '<div class="sg"><div class="sg-title">GitHub connection</div>'+
        '<p style="font-size:13px;color:var(--text-2);margin-bottom:14px;line-height:1.6">The app uses the GitHub API to publish audio and update your feed automatically. You need a Personal Access Token with <strong style="color:var(--text)">repo</strong> permission.</p>'+
        '<div class="field"><label>GitHub username</label><input type="text" id="s-ghuser" value="'+esc(S.ghUser)+'" placeholder="yourusername" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/></div>'+
        '<div class="field"><label>Repository name</label><input type="text" id="s-ghrepo" value="'+esc(S.ghRepo)+'" placeholder="OttoPod" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/></div>'+
        '<div class="field"><label>Branch</label><input type="text" id="s-ghbranch" value="'+esc(S.ghBranch||'main')+'" placeholder="main" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/></div>'+
        '<div class="field"><label>Personal Access Token</label><input type="password" id="s-ghtoken" value="'+esc(S.ghToken)+'" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/><p class="hint">Go to <a href="https://github.com/settings/tokens/new" target="_blank">github.com/settings/tokens/new</a> → check <strong>repo</strong> → generate → paste here. Stored locally in your browser only.</p></div>'+
        '<div class="row" style="margin-bottom:0">'+
          '<button type="button" class="btn primary" onclick="saveGitHub()">'+I.check+' Save & test connection</button>'+
        '</div>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Podcast info</div>'+
        '<div class="field"><label>Title</label><input type="text" id="s-title" value="'+esc(S.feedTitle)+'"/></div>'+
        '<div class="field"><label>Description</label><textarea id="s-desc">'+esc(S.feedDesc)+'</textarea></div>'+
        '<div class="field"><label>Author</label><input type="text" id="s-author" value="'+esc(S.feedAuthor)+'"/></div>'+
        '<div class="field" style="margin-bottom:14px">'+
          '<label>Podcast cover art</label>'+
          '<div class="upload-zone '+(S._coverFile?'has-file':'')+' " style="padding:16px" onclick="document.getElementById(\'_cover-in\').click()">'+
            '<input type="file" id="_cover-in" accept="image/*" onchange="coverChosen(this)"/>'+
            (S._coverFile
              ?'<p style="color:var(--green);font-weight:500;font-size:13px">'+esc(S._coverFile.name)+'</p><small style="color:var(--green)">tap to change</small>'
              :(S.artworkUrl?'<img src="'+esc(S.artworkUrl)+'" style="width:60px;height:60px;border-radius:8px;object-fit:cover;margin:0 auto 6px;display:block" alt="cover"/><small style="color:var(--text-2)">tap to change</small>':'<div style="opacity:.4;margin-bottom:4px">'+I.camera+'</div><p style="font-size:13px">Tap to choose cover art</p><small>Square JPG or PNG</small>')
            )+
          '</div>'+
        '</div>'+
        '<button type="button" class="btn primary" onclick="saveSettings()">'+I.check+' Save podcast info</button>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Change password</div>'+
        '<div class="field" style="margin-bottom:12px"><label>New password</label><input type="password" id="new-pass" placeholder="Enter new password" autocomplete="new-password"/></div>'+
        '<button type="button" class="btn secondary" onclick="changePass()">Update password</button>'+
      '</div>'+
      '<div class="sg" style="border-color:#3A2222"><div class="sg-title" style="color:var(--red)">Danger zone</div>'+
        '<p style="font-size:13px;color:var(--text-3);margin-bottom:12px">Removes all episode records locally. Does not delete files from GitHub.</p>'+
        '<button type="button" class="btn red" onclick="clearAll()">'+I.trash+' Clear all episodes</button>'+
      '</div>';
  }

  var artSrc=S.artworkUrl||null;
  var heroArt=artSrc?'<div class="hero-art"><img src="'+esc(artSrc)+'" alt="artwork"/></div>':'<div class="hero-art" style="color:var(--text-3)">'+I.music+'</div>';

  root.innerHTML='<div class="shell">'+
    '<div class="hero">'+heroArt+
      '<div class="hero-info">'+
        '<div class="hero-title">'+esc(S.feedTitle)+'</div>'+
        '<div class="hero-sub"><span class="live-dot"></span><span>Private feed</span><span style="color:var(--text-3)">·</span><span>'+S.episodes.length+' episode'+(S.episodes.length!==1?'s':'')+'</span>'+(isConfigured()?'<span style="color:var(--text-3)">·</span><span style="color:var(--green)">GitHub connected</span>':'<span style="color:var(--text-3)">·</span><span style="color:var(--gold)">Setup needed</span>')+'</div>'+
      '</div>'+
      '<button type="button" class="btn-ghost" onclick="doLogout()" title="Sign out">'+I.logout+'</button>'+
    '</div>'+
    '<div class="tabs">'+
      [{id:'episodes',label:'Episodes'},{id:'upload',label:'Upload'},{id:'feed',label:'RSS Feed'},{id:'settings',label:'Settings'}].map(function(t){
        return'<button type="button" class="tab'+(S.tab===t.id?' active':'')+'" onclick="setState({tab:\''+t.id+'\'})">'+t.label+'</button>';
      }).join('')+
    '</div>'+
    '<div class="content">'+content+'</div>'+
  '</div>';

  bindInputs();
}

function bindInputs(){
  function bind(id,key){var el=document.getElementById(id);if(el)el.addEventListener('input',function(e){S[key]=e.target.value;});}
  bind('ep-title','_title');bind('ep-desc','_desc');bind('ep-dur','_dur');
  bind('s-title','feedTitle');bind('s-desc','feedDesc');bind('s-author','feedAuthor');
  bind('s-ghuser','ghUser');bind('s-ghrepo','ghRepo');bind('s-ghbranch','ghBranch');bind('s-ghtoken','ghToken');
  bind('f-token','feedToken');
}

// ── File pickers ──────────────────────────────────────────────────
function audioChosen(el){var f=el.files[0];if(f){S._f=f;render();}}
function artChosen(el){var f=el.files[0];if(f){S._artFile=f;render();}}
function coverChosen(el){var f=el.files[0];if(f){S._coverFile=f;render();}}
function cancelUpload(){S._f=null;S._title='';S._desc='';S._dur='';S._artFile=null;setState({tab:'episodes'});}

// ── Actions ───────────────────────────────────────────────────────
function doLogin(){
  var val=document.getElementById('pass-in').value;
  var stored=getPass();
  if(!stored){if(!val.trim()){toast('Type a password to set one');return;}setPass(val);S.authed=true;render();return;}
  if(val===stored){S.authed=true;render();}else toast('Incorrect password');
}
function doLogout(){setState({authed:false});}

function saveGitHub(){
  var u=document.getElementById('s-ghuser'),r=document.getElementById('s-ghrepo'),b=document.getElementById('s-ghbranch'),t=document.getElementById('s-ghtoken');
  if(u)S.ghUser=u.value.trim();if(r)S.ghRepo=r.value.trim();if(b)S.ghBranch=b.value.trim()||'main';if(t)S.ghToken=t.value.trim();
  if(!S.ghToken||!S.ghUser||!S.ghRepo){toast('Please fill in all GitHub fields');return;}
  // Test connection
  fetch('https://api.github.com/repos/'+S.ghUser+'/'+S.ghRepo,{headers:ghHeaders()})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
    .then(function(res){
      if(res.ok){saveMeta();render();toast('Connected to '+S.ghUser+'/'+S.ghRepo+' ✓');}
      else toast('Connection failed: '+(res.d.message||'check your token and repo name'),4000);
    })
    .catch(function(){toast('Connection failed — check your internet connection',4000);});
}

function saveSettings(){
  var t=document.getElementById('s-title'),d=document.getElementById('s-desc'),a=document.getElementById('s-author');
  if(t)S.feedTitle=t.value;if(d)S.feedDesc=d.value;if(a)S.feedAuthor=a.value;

  if(S._coverFile){
    showProgress('Uploading cover art…',['Upload cover art','Update RSS feed']);
    publishCoverArt(S._coverFile,function(ok){
      if(ok){
        updateStep(0,'done');
        // republish feed with new artwork
        var b64=btoa(unescape(encodeURIComponent(buildRSS())));
        updateStep(1,'active','Updating feed…');
        ghUpload('feed.xml',b64,'Update podcast info',function(ok2){
          updateStep(1,ok2?'done':'error');
          S._coverFile=null;saveMeta();
          setTimeout(function(){hideProgress();render();toast('Saved and published');},700);
        });
      } else {
        hideProgress();toast('Cover art upload failed',4000);
      }
    });
  } else {
    saveMeta();
    if(isConfigured()){
      // republish feed silently
      var b64=btoa(unescape(encodeURIComponent(buildRSS())));
      ghUpload('feed.xml',b64,'Update podcast info',function(){});
    }
    render();toast('Settings saved');
  }
}

function saveToken(){
  var t=document.getElementById('f-token');if(t)S.feedToken=t.value.trim();
  saveMeta();
  if(!isConfigured()){toast('Connect GitHub in Settings first');return;}
  showProgress('Updating feed…',['Update feed.xml']);
  updateStep(0,'active','Publishing…');
  var b64=btoa(unescape(encodeURIComponent(buildRSS())));
  ghUpload('feed.xml',b64,'Update feed token',function(ok){
    updateStep(0,ok?'done':'error');
    setTimeout(function(){hideProgress();render();toast(ok?'Feed updated':'Update failed');},700);
  });
}

function randomToken(){var t=document.getElementById('f-token');var tok=genToken();if(t)t.value=tok;S.feedToken=tok;}
function clearToken(){var t=document.getElementById('f-token');if(t)t.value='';S.feedToken='';}

function deleteEp(id){
  if(!confirm('Remove this episode? (Does not delete audio from GitHub)'))return;
  S.episodes=S.episodes.filter(function(e){return e.id!==id;});
  saveMeta();
  if(isConfigured()){
    var b64=btoa(unescape(encodeURIComponent(buildRSS())));
    ghUpload('feed.xml',b64,'Remove episode',function(){});
  }
  render();toast('Episode removed');
}
function clearAll(){
  if(!confirm('Clear all episode records?'))return;
  S.episodes=[];saveMeta();render();toast('Cleared');
}

function changePass(){
  var v=document.getElementById('new-pass').value.trim();
  if(!v){toast('Enter a new password');return;}
  setPass(v);toast('Password updated');document.getElementById('new-pass').value='';
}

function copyUrl(){
  var url=getRssUrl();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast('URL copied');}).catch(function(){fbCopy(url);});}
  else fbCopy(url);
}
function fbCopy(text){
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');toast('URL copied');}catch(e){toast('Long-press to copy');}
  document.body.removeChild(ta);
}

loadAll();render();
</script>
