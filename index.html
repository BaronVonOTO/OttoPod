<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0D1117;--surface:#161C27;--surface2:#1E2638;--border:#2A3447;--gold:#C9A84C;--gold-dim:#8A6E2F;--text:#F0EDE6;--text-2:#8B93A8;--text-3:#4E5668;--red:#C25252;--green:#4DAF82;--radius:10px;--radius-lg:14px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;-webkit-text-size-adjust:100%}
.shell{max-width:580px;margin:0 auto;padding:28px 18px 60px}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:32px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.hero-art{width:72px;height:72px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-info{flex:1;min-width:0}
.hero-title{font-family:'DM Serif Display',serif;font-size:21px;line-height:1.2;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-sub{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 0 2px rgba(77,175,130,.18)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text-2);font-family:'Inter',sans-serif;font-size:13px;padding:6px 11px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-ghost:hover{border-color:var(--text-2);color:var(--text)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{background:none;border:none;font-family:'Inter',sans-serif;font-size:13px;color:var(--text-2);padding:0 0 12px;margin-right:22px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:500}
.tab:hover:not(.active){color:var(--text)}
.content{animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;border:none;min-height:40px;transition:opacity .15s}
.btn:active{opacity:.7}
.btn.primary{background:var(--gold);color:#0D1117}
.btn.primary:hover{opacity:.88}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.secondary:hover{border-color:var(--text-2)}
.btn.red{background:none;border:1px solid #3A2222;color:var(--red)}
.btn.red:hover{background:#1E1414}
.btn:disabled{opacity:.35;cursor:default}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:500}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;border-radius:var(--radius);padding:9px 12px;-webkit-appearance:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold-dim)}
.field textarea{resize:vertical;min-height:68px}
.hint{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.5}
.hint a{color:var(--text-2);text-decoration:underline}
.sg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px}
.sg-title{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-end{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.ep-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.ep-row:last-child{border-bottom:none}
.ep-art{width:50px;height:50px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ep-art img{width:100%;height:100%;object-fit:cover}
.ep-info{flex:1;min-width:0}
.ep-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.ep-meta{font-size:11px;color:var(--text-2)}
.ep-links{margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.ep-link{font-size:11px;color:var(--gold);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;display:inline-block}
.empty-state{text-align:center;padding:48px 16px;color:var(--text-3)}
.empty-state p{font-size:14px;margin-bottom:4px}
.empty-state small{font-size:12px}
.url-display{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;font-family:monospace;font-size:12px;color:var(--text-2);word-break:break-all;line-height:1.6;margin:10px 0}
.url-token{color:var(--gold);font-weight:500}
.input-row{display:flex;gap:6px;align-items:flex-end}
.input-row .field{flex:1;margin-bottom:0}
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 28px;width:100%;max-width:300px;text-align:center}
.auth-logo{font-family:'DM Serif Display',serif;font-size:26px;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--text-2);margin-bottom:24px}
.step-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;font-size:13px;line-height:1.7;color:var(--text-2)}
.step-box strong{color:var(--text);display:block;margin-bottom:2px}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#0D1117;font-size:11px;font-weight:700;flex-shrink:0;margin-right:6px}
.tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:monospace;font-size:11px;color:var(--text-2)}
input[type=file]{display:none}
@media(max-width:400px){.hero-title{font-size:18px}.shell{padding:20px 14px 50px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
var SK='ottopod_v5';
var S={
  authed:false,tab:'episodes',
  episodes:[],
  feedTitle:'My Private Podcast',feedDesc:'A private podcast feed',feedAuthor:'Podcast Author',
  artworkUrl:'',
  repoBase:'',feedToken:'',
  loaded:false
};

// ── Storage (localStorage for settings + episode metadata only — no files) ──
function saveMeta(){
  var d={episodes:S.episodes,feedTitle:S.feedTitle,feedDesc:S.feedDesc,feedAuthor:S.feedAuthor,artworkUrl:S.artworkUrl,repoBase:S.repoBase,feedToken:S.feedToken};
  try{localStorage.setItem(SK,JSON.stringify(d));}catch(e){}
}
function loadAll(){
  try{
    var d=JSON.parse(localStorage.getItem(SK)||'{}');
    ['episodes','feedTitle','feedDesc','feedAuthor','artworkUrl','repoBase','feedToken'].forEach(function(k){if(d[k]!==undefined)S[k]=d[k];});
  }catch(e){}
  if(!S.repoBase&&window.location.hostname.endsWith('github.io')){
    // auto-detect: https://user.github.io/repo
    var parts=window.location.pathname.split('/').filter(Boolean);
    S.repoBase=window.location.origin+(parts.length?'/'+parts[0]:'');
  }
  S.loaded=true;
}
function getPass(){try{return localStorage.getItem('pod_pass_v3')||null;}catch(e){return null;}}
function setPass(p){try{localStorage.setItem('pod_pass_v3',p);}catch(e){}}

// ── Helpers ──
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function genToken(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return b.toString(36);}).join('').slice(0,20);}
function getRssUrl(){
  var base=(S.repoBase||'').replace(/\/+$/,'');
  var tok=(S.feedToken||'').trim();
  return base+'/feed.xml'+(tok?'?token='+tok:'');
}
function rawUrl(filename){
  // Convert github.io URL to raw file URL
  var base=(S.repoBase||'').replace(/\/+$/,'');
  return base+'/'+filename;
}

function toast(msg){
  var el=document.getElementById('_t');
  if(!el){el=document.createElement('div');el.id='_t';el.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#F0EDE6;color:#0D1117;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9999;white-space:nowrap;font-family:Inter,sans-serif';document.body.appendChild(el);}
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity='0';},2400);
}
function setState(u){Object.keys(u).forEach(function(k){S[k]=u[k];});render();}

var I={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polyline points="20 6 9 17 4 12"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;opacity:.35"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>',
  music:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:20px;height:20px"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  github:'<svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.085 1.838 1.236 1.838 1.236 1.07 1.835 2.807 1.305 3.492.998.108-.776.418-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.605-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12"/></svg>'
};

// ── Render ──
function render(){
  var root=document.getElementById('root');if(!root)return;
  if(!S.loaded){root.innerHTML='<div class="auth-shell"><div style="color:var(--text-3);font-size:13px">Loading…</div></div>';return;}

  if(!S.authed){
    root.innerHTML='<div class="auth-shell"><div class="auth-card">'+
      '<div style="display:flex;justify-content:center;margin-bottom:16px">'+I.lock+'</div>'+
      '<div class="auth-logo">Studio</div>'+
      '<div class="auth-sub">Your private podcast manager</div>'+
      '<div class="field"><input type="password" id="pass-in" placeholder="Password" autocomplete="current-password" style="text-align:center"/></div>'+
      '<button type="button" class="btn primary" style="width:100%;justify-content:center" onclick="doLogin()">Enter</button>'+
    '</div></div>';
    var pi=document.getElementById('pass-in');
    if(pi)pi.addEventListener('keydown',function(e){if(e.keyCode===13)doLogin();});
    return;
  }

  var content='';

  // ── EPISODES tab ──
  if(S.tab==='episodes'){
    var rows='';
    if(!S.episodes.length){
      rows='<div class="empty-state"><div style="margin-bottom:12px;opacity:.4">'+I.mic+'</div><p>No episodes yet</p><small>Go to Add Episode to get started</small></div>';
    } else {
      S.episodes.forEach(function(ep){
        var art=ep.artworkUrl?'<div class="ep-art"><img src="'+esc(ep.artworkUrl)+'" alt=""/></div>':(S.artworkUrl?'<div class="ep-art"><img src="'+esc(S.artworkUrl)+'" alt=""/></div>':'<div class="ep-art" style="color:var(--text-3)">'+I.music+'</div>');
        rows+='<div class="ep-row">'+art+
          '<div class="ep-info">'+
            '<div class="ep-title">'+esc(ep.title)+'</div>'+
            '<div class="ep-meta">'+fmtDate(ep.date)+(ep.duration?' · '+ep.duration:'')+'</div>'+
            '<div class="ep-links">'+
              (ep.audioUrl?'<a class="ep-link" href="'+esc(ep.audioUrl)+'" target="_blank">🎵 '+esc(ep.audioUrl.split('/').pop())+'</a>':'')+
            '</div>'+
          '</div>'+
          '<button type="button" class="btn red" style="padding:7px 10px;min-height:36px;flex-shrink:0" onclick="deleteEp(\''+ep.id+'\')" aria-label="Delete">'+I.trash+'</button>'+
        '</div>';
      });
    }
    content='<div style="display:flex;justify-content:flex-end;margin-bottom:18px">'+
      '<button type="button" class="btn primary" onclick="setState({tab:\'add\'})">'+I.plus+' Add episode</button>'+
    '</div><div>'+rows+'</div>';
  }

  // ── ADD EPISODE tab ──
  if(S.tab==='add'){
    var base=(S.repoBase||'').replace(/\/+$/,'');
    content=
      '<div class="sg"><div class="sg-title">How to add an episode</div>'+
        '<div class="step-box"><span class="step-num">1</span><strong>Upload your MP3 to GitHub</strong>Go to your GitHub repo → Add file → Upload files → drag your <span class="tag">.mp3</span> file → Commit changes.</div>'+
        '<div class="step-box"><span class="step-num">2</span><strong>Copy its URL</strong>After uploading, click the file in GitHub, then click the download icon. The URL will look like:<br><span class="tag">'+(base||'https://yourname.github.io/OttoPod')+'/episode1.mp3</span></div>'+
        '<div class="step-box"><span class="step-num">3</span><strong>Paste it below and save</strong>Fill in the details, paste the URL, hit Save Episode.</div>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Episode details</div>'+
        '<div class="field"><label>Title</label><input type="text" id="ep-title" placeholder="Episode title" value="'+esc(S._newTitle||'')+'"/></div>'+
        '<div class="field"><label>Description</label><textarea id="ep-desc" placeholder="Optional">'+esc(S._newDesc||'')+'</textarea></div>'+
        '<div class="field"><label>Duration</label><input type="text" id="ep-dur" placeholder="e.g. 32:10" value="'+esc(S._newDur||'')+'"/><p class="hint">Minutes:seconds — check your audio file properties</p></div>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Audio file URL</div>'+
        '<div class="field"><label>GitHub URL to your MP3</label><input type="text" id="ep-audio" placeholder="'+(base||'https://yourname.github.io/OttoPod')+'/episode1.mp3" value="'+esc(S._newAudio||'')+'"/><p class="hint">Upload the MP3 to GitHub first, then paste the URL here</p></div>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Episode artwork URL <span style="font-weight:400;color:var(--text-3)">(optional)</span></div>'+
        '<div class="field"><label>GitHub URL to image</label><input type="text" id="ep-art" placeholder="'+(base||'https://yourname.github.io/OttoPod')+'/cover.jpg" value="'+esc(S._newArt||'')+'"/><p class="hint">Leave blank to use your podcast cover. Upload image to GitHub first.</p></div>'+
      '</div>'+
      '<div class="row-end">'+
        '<button type="button" class="btn secondary" onclick="cancelAdd()">Cancel</button>'+
        '<button type="button" class="btn primary" onclick="saveEpisode()">'+I.check+' Save episode</button>'+
      '</div>';
  }

  // ── FEED tab ──
  if(S.tab==='feed'){
    var rssUrl=getRssUrl();
    var parts=rssUrl.split('?token=');
    var urlHtml=esc(parts[0])+(parts[1]?'<span style="color:var(--text-3)">?token=</span><span class="url-token">'+esc(parts[1])+'</span>':'');
    var base2=(S.repoBase||'').replace(/\/+$/,'');
    content=
      '<div class="sg"><div class="sg-title">Your GitHub repo base URL</div>'+
        '<div class="field"><label>Base URL</label><input type="text" id="f-base" value="'+esc(S.repoBase)+'" placeholder="https://yourname.github.io/OttoPod" autocomplete="off" autocorrect="off" autocapitalize="none"/><p class="hint">Everything will be hosted under this URL</p></div>'+
        '<div class="field"><label>Secret token <span style="font-weight:400;color:var(--text-3)">(optional)</span></label>'+
          '<div class="input-row">'+
            '<div class="field"><input type="text" id="f-token" value="'+esc(S.feedToken)+'" placeholder="leave blank for no token" autocomplete="off" autocorrect="off" autocapitalize="none" style="font-family:monospace;font-size:13px"/></div>'+
            '<button type="button" class="btn secondary" onclick="randomToken()" style="flex-shrink:0;padding:9px 12px" title="Random">'+I.shuffle+'</button>'+
            '<button type="button" class="btn red" onclick="clearToken()" style="flex-shrink:0;padding:9px 10px;min-height:40px" title="Clear">'+I.x+'</button>'+
          '</div>'+
          '<p class="hint">Share the full URL with this token with your friends. Anyone with it can subscribe.</p>'+
        '</div>'+
        '<button type="button" class="btn primary" onclick="saveFeedSettings()">'+I.check+' Save</button>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Your RSS feed URL</div>'+
        '<div class="url-display" id="url-display">'+urlHtml+'</div>'+
        '<div class="row" style="margin-bottom:14px">'+
          '<button type="button" class="btn secondary" onclick="copyUrl()">'+I.copy+' Copy URL</button>'+
        '</div>'+
        '<div class="sg-title" style="margin-top:4px">Download & upload to GitHub</div>'+
        '<div class="step-box"><span class="step-num">1</span><strong>Download feed.xml</strong>Click the button below to download your RSS file.</div>'+
        '<div class="step-box"><span class="step-num">2</span><strong>Upload to GitHub</strong>Go to your repo → Add file → Upload files → upload <span class="tag">feed.xml</span> → Commit. If one already exists, it will be replaced.</div>'+
        '<div class="step-box"><span class="step-num">3</span><strong>Share the URL</strong>Your RSS feed is now live at:<br><span class="tag">'+esc(rssUrl)+'</span><br>Share this with your friends to subscribe.</div>'+
        '<div class="row" style="margin-top:14px">'+
          '<button type="button" class="btn primary" onclick="downloadRSS()">'+I.dl+' Download feed.xml</button>'+
        '</div>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Add to podcast apps</div>'+
        '<div style="line-height:2;font-size:13px;color:var(--text-2)">'+
          '<div><span style="color:var(--text);font-weight:500">Apple Podcasts</span> — Library → Add a Show → paste URL</div>'+
          '<div><span style="color:var(--text);font-weight:500">Overcast</span> — + → Add URL → paste URL</div>'+
          '<div><span style="color:var(--text);font-weight:500">Pocket Casts</span> — Discover → Add via URL</div>'+
        '</div>'+
      '</div>';
  }

  // ── SETTINGS tab ──
  if(S.tab==='settings'){
    content=
      '<div class="sg"><div class="sg-title">Podcast info</div>'+
        '<div class="field"><label>Title</label><input type="text" id="s-title" value="'+esc(S.feedTitle)+'"/></div>'+
        '<div class="field"><label>Description</label><textarea id="s-desc">'+esc(S.feedDesc)+'</textarea></div>'+
        '<div class="field"><label>Author</label><input type="text" id="s-author" value="'+esc(S.feedAuthor)+'"/></div>'+
        '<div class="field" style="margin-bottom:14px"><label>Podcast artwork URL</label><input type="text" id="s-art" value="'+esc(S.artworkUrl)+'" placeholder="https://yourname.github.io/OttoPod/cover.jpg" autocomplete="off" autocorrect="off" autocapitalize="none"/><p class="hint">Upload your cover art to GitHub and paste the URL here</p></div>'+
        '<button type="button" class="btn primary" onclick="saveSettings()">'+I.check+' Save</button>'+
      '</div>'+
      '<div class="sg"><div class="sg-title">Change password</div>'+
        '<div class="field" style="margin-bottom:12px"><label>New password</label><input type="password" id="new-pass" placeholder="Enter new password" autocomplete="new-password"/></div>'+
        '<button type="button" class="btn secondary" onclick="changePass()">Update password</button>'+
      '</div>'+
      '<div class="sg" style="border-color:#3A2222"><div class="sg-title" style="color:var(--red)">Danger zone</div>'+
        '<p style="font-size:13px;color:var(--text-3);margin-bottom:12px">Removes all episode entries. Does not delete files from GitHub.</p>'+
        '<button type="button" class="btn red" onclick="clearAll()">'+I.trash+' Delete all episodes</button>'+
      '</div>';
  }

  // artwork for hero
  var artSrc=S.artworkUrl||null;
  var heroArt=artSrc
    ?'<div class="hero-art"><img src="'+esc(artSrc)+'" alt="artwork"/></div>'
    :'<div class="hero-art" style="color:var(--text-3)">'+I.music+'</div>';

  root.innerHTML='<div class="shell">'+
    '<div class="hero">'+
      heroArt+
      '<div class="hero-info">'+
        '<div class="hero-title">'+esc(S.feedTitle)+'</div>'+
        '<div class="hero-sub"><span class="live-dot"></span><span>Private feed</span><span style="color:var(--text-3)">·</span><span>'+S.episodes.length+' episode'+(S.episodes.length!==1?'s':'')+'</span></div>'+
      '</div>'+
      '<button type="button" class="btn-ghost" onclick="doLogout()" title="Sign out">'+I.logout+'</button>'+
    '</div>'+
    '<div class="tabs">'+
      [{id:'episodes',label:'Episodes'},{id:'add',label:'Add Episode'},{id:'feed',label:'RSS Feed'},{id:'settings',label:'Settings'}].map(function(t){
        return'<button type="button" class="tab'+(S.tab===t.id?' active':'')+'" onclick="setState({tab:\''+t.id+'\'})">'+t.label+'</button>';
      }).join('')+
    '</div>'+
    '<div class="content">'+content+'</div>'+
  '</div>';

  bindInputs();
}

function bindInputs(){
  function bind(id,key){var el=document.getElementById(id);if(el)el.addEventListener('input',function(e){S[key]=e.target.value;});}
  bind('ep-title','_newTitle');bind('ep-desc','_newDesc');bind('ep-dur','_newDur');bind('ep-audio','_newAudio');bind('ep-art','_newArt');
  bind('s-title','feedTitle');bind('s-desc','feedDesc');bind('s-author','feedAuthor');bind('s-art','artworkUrl');
  bind('f-base','repoBase');bind('f-token','feedToken');
}

// ── Actions ──
function doLogin(){
  var val=document.getElementById('pass-in').value;
  var stored=getPass();
  if(!stored){if(!val.trim()){toast('Enter a password to set');return;}setPass(val);S.authed=true;render();return;}
  if(val===stored){S.authed=true;render();}else toast('Incorrect password');
}
function doLogout(){setState({authed:false});}

function saveEpisode(){
  var title=(S._newTitle||'').trim();
  var audio=(S._newAudio||'').trim();
  if(!title){toast('Please enter a title');return;}
  if(!audio){toast('Please enter the audio URL');return;}
  var ep={id:'ep_'+Date.now(),title:title,desc:S._newDesc||'',duration:S._newDur||'',date:Date.now(),audioUrl:audio,artworkUrl:(S._newArt||'').trim()};
  S.episodes.unshift(ep);
  S._newTitle='';S._newDesc='';S._newDur='';S._newAudio='';S._newArt='';
  saveMeta();
  setState({tab:'episodes'});
  toast('Episode saved — remember to re-download and re-upload feed.xml');
}
function cancelAdd(){S._newTitle='';S._newDesc='';S._newDur='';S._newAudio='';S._newArt='';setState({tab:'episodes'});}

function deleteEp(id){
  if(!confirm('Remove this episode?'))return;
  S.episodes=S.episodes.filter(function(e){return e.id!==id;});
  saveMeta();render();toast('Episode removed');
}
function clearAll(){
  if(!confirm('Remove all episodes?'))return;
  S.episodes=[];saveMeta();render();toast('All episodes removed');
}

function saveFeedSettings(){
  var b=document.getElementById('f-base'),t=document.getElementById('f-token');
  if(b)S.repoBase=b.value.trim();if(t)S.feedToken=t.value.trim();
  saveMeta();toast('Saved');
  var d=document.getElementById('url-display');
  if(d){var url=getRssUrl();var p=url.split('?token=');d.innerHTML=esc(p[0])+(p[1]?'<span style="color:var(--text-3)">?token=</span><span class="url-token">'+esc(p[1])+'</span>':'');}
}
function randomToken(){var t=document.getElementById('f-token');var tok=genToken();if(t)t.value=tok;S.feedToken=tok;}
function clearToken(){var t=document.getElementById('f-token');if(t)t.value='';S.feedToken='';}

function saveSettings(){
  var t=document.getElementById('s-title'),d=document.getElementById('s-desc'),a=document.getElementById('s-author'),art=document.getElementById('s-art');
  if(t)S.feedTitle=t.value;if(d)S.feedDesc=d.value;if(a)S.feedAuthor=a.value;if(art)S.artworkUrl=art.value.trim();
  saveMeta();render();toast('Settings saved');
}
function changePass(){
  var v=document.getElementById('new-pass').value.trim();
  if(!v){toast('Enter a new password');return;}
  setPass(v);toast('Password updated');document.getElementById('new-pass').value='';
}

function generateRSS(){
  var base=(S.repoBase||'').replace(/\/+$/,'');
  var items=S.episodes.map(function(ep){
    var artUrl=ep.artworkUrl||S.artworkUrl||'';
    return'<item>\n'+
      '  <title><![CDATA['+ep.title+']]></title>\n'+
      '  <description><![CDATA['+(ep.desc||'')+']]></description>\n'+
      '  <pubDate>'+new Date(ep.date).toUTCString()+'</pubDate>\n'+
      '  <guid isPermaLink="false">'+ep.id+'</guid>\n'+
      '  <enclosure url="'+ep.audioUrl+'" length="0" type="audio/mpeg"/>\n'+
      (artUrl?'  <itunes:image href="'+artUrl+'"/>\n':'')+
      (ep.duration?'  <itunes:duration>'+ep.duration+'</itunes:duration>\n':'')+
    '</item>';
  }).join('\n');
  return'<?xml version="1.0" encoding="UTF-8"?>\n'+
    '<rss version="2.0" xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd" xmlns:atom="http://www.w3.org/2005/Atom">\n'+
    '<channel>\n'+
    '  <title><![CDATA['+S.feedTitle+']]></title>\n'+
    '  <link>'+base+'</link>\n'+
    '  <description><![CDATA['+S.feedDesc+']]></description>\n'+
    '  <itunes:author>'+S.feedAuthor+'</itunes:author>\n'+
    (S.artworkUrl?'  <itunes:image>\n    <url>'+S.artworkUrl+'</url>\n    <title>'+S.feedTitle+'</title>\n    <link>'+base+'</link>\n  </itunes:image>\n':'')+
    '  <language>en-us</language>\n'+
    '  <lastBuildDate>'+new Date().toUTCString()+'</lastBuildDate>\n'+
    items+'\n'+
    '</channel>\n</rss>';
}
function downloadRSS(){
  var blob=new Blob([generateRSS()],{type:'application/xml'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='feed.xml';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast('feed.xml downloaded — upload it to GitHub');
}
function copyUrl(){
  var url=getRssUrl();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast('URL copied');}).catch(function(){fbCopy(url);});}
  else fbCopy(url);
}
function fbCopy(text){
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');toast('URL copied');}catch(e){toast('Long-press to copy');}
  document.body.removeChild(ta);
}

// ── Boot ──
loadAll();
render();
</script>
</body>
</html>
